<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" role="img" aria-labelledby="t d">
<title id="t">The factory floor: spec, agents, gates, human</title>
<desc id="d">Stage select screen. Stage 1, Spec: intent, written down before any code. Stage 2, Agents: many harnesses, many models, one job each. Stage 3, Gates: tests, coverage, evals and AI review. Boss, Human: a person promotes it to production.</desc>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".25"/></pattern></defs>
<style>text{font-family:'Courier New', Courier, 'Liberation Mono', monospace;font-weight:700}.blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.blink{animation:none}}</style>
<rect width="900" height="536" rx="14" fill="#0b0221"/>
<text x="450" y="58" font-size="34" fill="#fff" text-anchor="middle" letter-spacing="5">STAGE SELECT<tspan class="blink" fill="#05d9e8">_</tspan></text>
<g>
